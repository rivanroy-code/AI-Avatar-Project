<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Speech Practice Prototype — Emergency Demo</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:900px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:20px;padding:28px;box-shadow:0 12px 32px #18304c12}.row{display:grid;grid-template-columns:280px 1fr;gap:24px}.avatar{min-height:300px;border-radius:18px;background:#eaf2ff;display:grid;place-items:center;text-align:center;font-weight:800;color:#1f6feb}.bubble{margin-top:14px;padding:14px;border-radius:14px;background:#f5f7fb}.status{display:inline-block;background:#eef4ff;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800;color:#2b5ba7}button,select{font:inherit;padding:11px 15px;border-radius:10px}button{border:0;background:#1f6feb;color:#fff;font-weight:800;cursor:pointer}select{border:1px solid #cbd6e6;background:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{margin-top:20px;padding:18px;border-radius:14px;background:#f7f9fd}.small{color:#64748b;font-size:13px}.error{color:#9b2c2c}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Avatar-Guided Speech Practice</h1><p class="small">Research prototype — not a diagnostic or clinical tool.</p>
<div class="row"><div><div class="avatar">AI Avatar<br><span class="small">Tavus-ready presentation layer</span></div><div id="bubble" class="bubble">Hi! I'm here to guide a short practice activity.</div></div>
<div><div id="status" class="status">Status: Ready</div><p class="small">Current task</p><h2 id="prompt">“I like playing outside.”</h2>
<div class="controls"><button id="start">Start practice</button></div>
<div id="scenarioBox" hidden><p><strong>Simulated input scenario</strong></p><select id="scenario"><option value="success">No significant event</option><option value="repetition">Repetition</option><option value="prolongation">Prolongation</option><option value="long_pause">Long pause</option><option value="low_confidence">Low confidence</option><option value="error">Backend error</option></select><div class="controls"><button id="submit">Submit mock input</button></div></div>
<div id="feedback" class="feedback" hidden></div></div></div>
</div></div>
<script>
const API='http://localhost:8000'; const tasks=[{id:'phrase_001',prompt:'I like playing outside.'},{id:'phrase_002',prompt:'Today is a sunny day.'},{id:'phrase_003',prompt:'My favourite game is football.'}]; let i=0;
const $=id=>document.getElementById(id); function setStatus(t){$('status').textContent='Status: '+t} function setBubble(t){$('bubble').textContent=t}
$('start').onclick=()=>{setStatus('Task ready');setBubble("Let's practise the phrase shown on screen.");$('start').hidden=true;$('scenarioBox').hidden=false};
$('submit').onclick=async()=>{setStatus('Analysing');setBubble("I'm checking the response.");$('feedback').hidden=true;try{const r=await fetch(API+'/api/analyse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:tasks[i].id,input_type:'mock',mock_scenario:$('scenario').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');$('feedback').innerHTML=`<strong>${d.message}</strong><p class="small">event=${d.detected_event??'—'} · confidence=${d.confidence??'—'} · next=${d.next_action}</p><div class="controls"><button id="action">${d.next_action==='next'?'Next task':'Try again'}</button></div>`;$('feedback').hidden=false;setBubble(d.message);setStatus(d.next_action==='next'?'Feedback ready':d.next_action==='retry'?'Retry recommended':'Recovery required');$('action').onclick=()=>{if(d.next_action==='next'){i=(i+1)%tasks.length;$('prompt').textContent='“'+tasks[i].prompt+'”'}$('feedback').hidden=true;setStatus('Task ready');setBubble("Let's practise the phrase shown on screen.")}}catch(e){$('feedback').innerHTML='<strong class="error">'+e.message+'</strong>';$('feedback').hidden=false;setStatus('Backend unavailable')}};
</script>
</body></html>
